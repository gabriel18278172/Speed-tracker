<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Tiny Counter</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #111827;
      --line: rgba(255, 255, 255, 0.10);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #a78bfa;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(167, 139, 250, 0.16), transparent 30%),
        linear-gradient(180deg, #0b1020, var(--bg));
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(100%, 420px);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge {
      font-size: 0.8rem;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 8px 10px;
      border-radius: 999px;
    }

    .counter {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 26px 18px;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
    }

    .value {
      font-size: clamp(4rem, 18vw, 6rem);
      font-weight: 800;
      line-height: 1;
      margin: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .label {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 12px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    button:active { transform: scale(0.98); }
    button.primary {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(167, 139, 250, 0.18));
    }

    .stats {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.03);
    }

    .stat .k {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .stat .v {
      margin-top: 8px;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .footer {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 380px) {
      .buttons { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <h1>Tiny Counter</h1>
      <div class="badge">Saved on this device</div>
    </div>

    <section class="counter" aria-label="counter">
      <p class="value" id="count">0</p>
      <div class="label" id="message">Tap the big button to count up.</div>
    </section>

    <div class="buttons">
      <button class="primary" id="addBtn">+1</button>
      <button id="minusBtn">-1</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="k">Clicks today</div>
        <div class="v" id="todayClicks">0</div>
      </div>
      <div class="stat">
        <div class="k">Best streak</div>
        <div class="v" id="bestStreak">0</div>
      </div>
    </div>

    <div class="footer">A tiny one-page app with local storage.</div>
  </main>

  <script>
    const countEl = document.getElementById('count');
    const messageEl = document.getElementById('message');
    const todayClicksEl = document.getElementById('todayClicks');
    const bestStreakEl = document.getElementById('bestStreak');

    const state = {
      count: Number(localStorage.getItem('tinyCounter.count') || 0),
      todayClicks: Number(localStorage.getItem('tinyCounter.todayClicks') || 0),
      bestStreak: Number(localStorage.getItem('tinyCounter.bestStreak') || 0),
    };

    function save() {
      localStorage.setItem('tinyCounter.count', String(state.count));
      localStorage.setItem('tinyCounter.todayClicks', String(state.todayClicks));
      localStorage.setItem('tinyCounter.bestStreak', String(state.bestStreak));
    }

    function render() {
      countEl.textContent = state.count;
      todayClicksEl.textContent = state.todayClicks;
      bestStreakEl.textContent = state.bestStreak;

      if (state.count === 0) {
        messageEl.textContent = 'Tap the big button to count up.';
      } else if (state.count > 0) {
        messageEl.textContent = 'Nice. Keep going.';
      } else {
        messageEl.textContent = 'You went below zero.';
      }
    }

    function tick(amount) {
      state.count += amount;
      if (amount > 0) {
        state.todayClicks += 1;
        state.bestStreak = Math.max(state.bestStreak, state.todayClicks);
      }
      save();
      render();
    }

    document.getElementById('addBtn').addEventListener('click', () => tick(1));
    document.getElementById('minusBtn').addEventListener('click', () => tick(-1));
    document.getElementById('resetBtn').addEventListener('click', () => {
      state.count = 0;
      state.todayClicks = 0;
      save();
      render();
    });

    render();
  </script>
</body>
</html>
